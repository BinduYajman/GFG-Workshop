{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="fade-in">Secure Checkout</h1>
    <p class="fade-in" style="transition-delay: 0.2s; margin-top: 20px; color: rgba(10,10,10,0.6);">Complete your AURELIA acquisition.</p>
</div>

<div class="container" style="padding-top: 40px; margin-bottom: 120px;">
    <section class="checkout-layout fade-in">
        
        <!-- Checkout Form -->
        <div class="checkout-form">
            <h3 style="font-size: 1.5rem; margin-bottom: 30px; border-bottom: 1px solid rgba(10,10,10,0.1); padding-bottom: 10px;">Shipping Details</h3>
            <form id="checkout-payment-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" required>
                    </div>
                    <div class="form-group">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="address">Shipping Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label for="zip">Postal Code</label>
                        <input type="text" id="zip" required>
                    </div>
                </div>

                <h3 style="font-size: 1.5rem; margin-top: 40px; margin-bottom: 30px; border-bottom: 1px solid rgba(10,10,10,0.1); padding-bottom: 10px;">Payment Information</h3>
                <div class="form-group">
                    <label for="card">Card Number</label>
                    <input type="text" id="card" placeholder="XXXX XXXX XXXX XXXX" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="exp">Expiration Date</label>
                        <input type="text" id="exp" placeholder="MM/YY" required>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" placeholder="XXX" required>
                    </div>
                </div>

                <button type="button" class="btn btn-gold" style="width: 100%; margin-top: 20px; font-size: 1rem; padding: 20px;" onclick="processCheckout()">Confirm Acquisition</button>
            </form>
        </div>

        <!-- Order Summary -->
        <div class="order-summary">
            <h3>Order Summary</h3>
            <div id="checkout-cart-items" style="margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 20px;">
                <!-- Populated by JS -->
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-family: var(--font-heading);">
                <span>Total</span>
                <span id="checkout-total-amount" style="color: var(--color-gold);">$0.00</span>
            </div>
        </div>

    </section>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        window.renderCheckoutCart = () => {
            const checkoutContainer = document.getElementById('checkout-cart-items');
            const checkoutTotal = document.getElementById('checkout-total-amount');
            
            if (!checkoutContainer) return;
            
            let cart = JSON.parse(localStorage.getItem('aurelia_cart')) || [];
            checkoutContainer.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                checkoutContainer.innerHTML = '<p style="color: rgba(255,255,255,0.7);">Your cart is empty.</p>';
                checkoutTotal.textContent = '$0.00';
            } else {
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    const div = document.createElement('div');
                    div.style.display = 'flex';
                    div.style.justifyContent = 'space-between';
                    div.style.marginBottom = '15px';
                    div.style.fontSize = '0.9rem';
                    
                    div.innerHTML = `
                        <div style="flex: 1;">
                            <div style="font-family: var(--font-heading);">${item.name} <span style="color: rgba(255,255,255,0.5);">x${item.quantity}</span></div>
                            <div style="color: #999; font-size: 0.8rem; cursor: pointer; text-decoration: underline;" onclick="removeFromCart('${item.id}')">Remove</div>
                        </div>
                        <div style="color: var(--color-gold);">${(item.price * item.quantity).toFixed(2)}</div>
                    `;
                    checkoutContainer.appendChild(div);
                });
                checkoutTotal.textContent = '$' + total.toFixed(2);
            }
        };

        // Render on load
        renderCheckoutCart();

        window.processCheckout = () => {
            let cart = JSON.parse(localStorage.getItem('aurelia_cart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }
            alert("Payment processed securely. Thank you for your acquisition from AURELIA.");
            localStorage.removeItem('aurelia_cart');
            window.location.href = "/";
        };
    });
</script>
{% endblock %}
